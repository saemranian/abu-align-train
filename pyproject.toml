[build-system]
requires = ["setuptools==79.0.1", "wheel==0.48.0"]
build-backend = "setuptools.build_meta"

[project]
name = "abu-align-train"
dynamic = ["version"]
description = "Abu local reconstruction tools and CPU desktop core"
authors = [{name = "Abu Align contributors"}]
requires-python = ">=3.11"
readme = "README.md"
# Preserve the existing custom VGGT grant; do not claim all retained source is Apache.
license = {file = "LICENSE.txt"}
dependencies = ["numpy==1.26.4", "scipy==1.17.1", "Pillow==11.3.0", "opencv-python==4.11.0.86", "trimesh==5.1.0", "viser==0.2.23", "psutil==7.2.2", "matplotlib==3.11.2", "pycolmap==4.2.0"]

[project.scripts]
abu-align = "align_cli:main"
abu-gui = "abu_align_gui:main"
abu-m54 = "abu_m54_app:main"
abu-doctor = "abu_components:main"

[tool.setuptools.dynamic]
version = {file = "VERSION.txt"}

[tool.setuptools.packages.find]
where = ["."]
include = ["vggt*", "installer"]
namespaces = false

[tool.setuptools.package-data]
installer = ["*.json", "*.in", "*.lock"]
