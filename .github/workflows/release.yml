name: Build & Publish Single-File Installers

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: release-main
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-windows:
    name: Windows Installer (.exe)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compile Windows Installer with Inno Setup
        shell: pwsh
        run: |
          $version = (Get-Content VERSION.txt -Raw).Trim().TrimStart('v', 'V')
          $csc = "C:\Windows\Microsoft.NET\Framework64\v4.0.30319\csc.exe"
          if (Test-Path $csc) {
            & $csc /nologo /target:winexe /win32icon:abu_icon.ico /out:Abu_Align_and_Train.exe launcher.cs
            & $csc /nologo /target:winexe /win32icon:abu_icon.ico /out:Abu_Align.exe launcher.cs
          }
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y
            $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          }
          & $iscc "/DMyAppVersion=$version" "installer\windows\abu_align_setup.iss"

      - name: Upload Windows Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: installer/dist/Abu_Align_and_Train_Setup_Windows_x64.exe

  build-macos:
    name: macOS Installer (.dmg)
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build macOS Universal DMG
        run: |
          tr -d '\r' < installer/macos/build_dmg.sh > installer/macos/build_dmg_lf.sh
          chmod +x installer/macos/build_dmg_lf.sh
          bash installer/macos/build_dmg_lf.sh

      - name: Upload macOS Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-installer
          path: installer/dist/Abu_Align_and_Train_macOS_Universal.dmg

  build-linux:
    name: Linux Single Binary (.AppImage)
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Linux AppImage
        run: |
          sudo apt-get update -y
          sudo apt-get install -y file desktop-file-utils libfuse2
          tr -d '\r' < installer/linux/build_appimage.sh > installer/linux/build_appimage_lf.sh
          chmod +x installer/linux/build_appimage_lf.sh
          bash installer/linux/build_appimage_lf.sh

      - name: Upload Linux Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-installer
          path: installer/dist/Abu_Align_and_Train_Linux_x86_64.AppImage

  publish-release:
    name: Publish GitHub Release
    needs: [build-windows, build-macos, build-linux]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve Version Tag
        id: version
        run: |
          RAW=$(tr -d '[:space:]vV' < VERSION.txt)
          echo "ver=$RAW" >> "$GITHUB_OUTPUT"
          echo "tag=v$RAW" >> "$GITHUB_OUTPUT"

      - name: Download All Built Installers
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Verify Built Assets
        run: |
          ls -lh release-assets/

      - name: Publish Installers to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Abu Align & Train ${{ steps.version.outputs.tag }}
          body: |
            ## 🚀 Abu Align & Train ${{ steps.version.outputs.tag }} — One-Click Single-File Installers

            Download a **single installation file** for your operating system below:
            - 🪟 **Windows (10 / 11 x64)**: `Abu_Align_and_Train_Setup_Windows_x64.exe`
            - 🍎 **macOS (Apple Silicon & Intel)**: `Abu_Align_and_Train_macOS_Universal.dmg`
            - 🐧 **Linux (x86_64 AppImage)**: `Abu_Align_and_Train_Linux_x86_64.AppImage`
          files: |
            release-assets/Abu_Align_and_Train_Setup_Windows_x64.exe
            release-assets/Abu_Align_and_Train_macOS_Universal.dmg
            release-assets/Abu_Align_and_Train_Linux_x86_64.AppImage
          generate_release_notes: true
          draft: false
          prerelease: false
